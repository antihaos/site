<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Geo Explorer Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Yandex Maps API -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=YOUR_API_KEY&lang=ru_RU" type="text/javascript"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; background: #0f172a; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        #map-container { width: 100%; height: 100vh; z-index: 1; position: relative; }
        .ui-layer { position: absolute; z-index: 10; pointer-events: none; width: 100%; height: 100%; top: 0; left: 0; }
        .interactive { pointer-events: auto; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .dark-glass {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        @keyframes slideUpFade {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-enter { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }

        .loader-ring { display: inline-block; width: 40px; height: 40px; }
        .loader-ring:after {
            content: " "; display: block; width: 30px; height: 30px; margin: 4px;
            border-radius: 50%; border: 3px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: loader-ring 1.2s linear infinite;
        }
        @keyframes loader-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .marker-label {
            position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%) translateY(-8px);
            white-space: nowrap; opacity: 0;
            transition: all 0.3s ease; pointer-events: none;
        }
        .marker-container:hover .marker-label {
            opacity: 1; transform: translateX(-50%) translateY(-12px);
        }
    </style>
</head>
<body class="text-slate-900">

    <div id="app" class="relative w-full h-screen">
        <div id="map-container"></div>
        <div id="ui-root" class="ui-layer"></div>
    </div>

    <script>
        const UI_SPEC = {
            components: {
                header: {
                    id: 'app-header',
                    classes: 'absolute top-6 left-6 right-6 interactive flex justify-between items-start animate-enter',
                    children: [
                        {
                            tag: 'div',
                            classes: 'glass-panel px-5 py-3 rounded-2xl shadow-lg flex items-center gap-3 group cursor-default',
                            innerHTML: `
                                <div class="relative flex h-3 w-3">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="font-bold text-sm tracking-wider leading-none">GEO<span class="text-blue-600">AR</span></span>
                                    <span class="text-[10px] text-slate-500 font-mono mt-0.5">EXPLORER v2.1</span>
                                </div>
                            `
                        },
                        {
                            tag: 'div',
                            classes: 'flex gap-2',
                            children: [
                                {
                                    tag: 'button',
                                    id: 'btn-locate-me',
                                    classes: 'glass-panel p-3 rounded-xl shadow-lg hover:bg-white/90 transition-all active:scale-95 group',
                                    innerHTML: '<svg class="w-5 h-5 text-slate-600 group-hover:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>'
                                },
                                {
                                    tag: 'button',
                                    id: 'btn-menu',
                                    classes: 'glass-panel p-3 rounded-xl shadow-lg hover:bg-white/90 transition-all active:scale-95',
                                    innerHTML: '<svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>'
                                }
                            ]
                        }
                    ]
                },
                sidebar: {
                    id: 'location-list',
                    classes: 'absolute top-24 left-6 bottom-6 w-80 glass-panel rounded-2xl shadow-2xl interactive flex flex-col overflow-hidden transform -translate-x-[110%] transition-transform duration-500 ease-out z-20 animate-enter',
                    // Structure used for initial shell, content injected via JS
                },
                arOverlay: {
                    id: 'ar-overlay',
                    classes: 'fixed inset-0 z-50 bg-slate-900 hidden flex-col',
                    structure: [
                        { type: 'canvas', id: 'ar-canvas', classes: 'w-full h-full block' },
                        { type: 'div', classes: 'absolute inset-0 pointer-events-none bg-gradient-to-b from-black/40 via-transparent to-black/40' },
                        { type: 'container', classes: 'absolute top-6 left-6 right-6 flex justify-between items-center interactive', children: [
                            { type: 'div', classes: 'dark-glass px-4 py-2 rounded-full text-xs font-mono font-medium flex items-center gap-2 border-l-2 border-blue-500', innerHTML: '<span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span> AR_SESSION_ACTIVE' },
                            { type: 'button', id: 'btn-ar-close', classes: 'dark-glass p-3 rounded-full hover:bg-slate-800 transition-colors', innerHTML: '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>' }
                        ]},
                        { type: 'container', id: 'ar-loader', classes: 'absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10 gap-4', children: [
                            { type: 'div', classes: 'loader-ring' },
                            { type: 'div', classes: 'text-white font-mono text-sm animate-pulse', innerHTML: 'ЗАГРУЗКА МОДЕЛИ...' }
                        ]}
                    ]
                },
                toast: {
                    id: 'toast-container',
                    classes: 'absolute bottom-6 left-1/2 transform -translate-x-1/2 z-40 flex flex-col gap-2 pointer-events-none'
                }
            }
        };

        const LOCATIONS_DATA = [
            {
                id: 1, coords: [55.751244, 37.618423], title: "Царь-Механизм", category: "АРТЕФАКТ",
                description: "Древний механизм, обнаруженный под фундаментом башни. Требуется калибровка временных потоков.",
                distance: "120м", modelUrl: "https://modelviewer.dev/shared-assets/models/Astronaut.glb"
            },
            {
                id: 2, coords: [55.753930, 37.620790], title: "Дрон-Разведчик X7", category: "ТЕХНИКА",
                description: "Автономный летательный аппарат с системой распознавания образов последнего поколения.",
                distance: "350м", modelUrl: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb"
            },
            {
                id: 3, coords: [55.749000, 37.615000], title: "Скульптура Потока", category: "ИСКУССТВО",
                description: "Интерактивная инсталляция, реагирующая на движение воздуха и звуковые волны.",
                distance: "800м", modelUrl: "https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb"
            }
        ];

        class App {
            constructor() {
                this.state = { selectedLocation: null, isSidebarOpen: false, isARActive: false };
                this.map = null;
                this.threeScene = null;
                this.init();
            }

            async init() {
                this.renderUI();
                await this.initMap();
                this.bindEvents();
            }

            renderUI() {
                const root = document.getElementById('ui-root');

                const createElement = (spec) => {
                    const el = document.createElement(spec.tag || 'div');
                    if (spec.classes) el.className = spec.classes;
                    if (spec.id) el.id = spec.id;
                    if (spec.innerHTML) el.innerHTML = spec.innerHTML;
                    if (spec.children) spec.children.forEach(c => el.appendChild(createElement(c)));
                    return el;
                };

                root.appendChild(createElement(UI_SPEC.components.header));

                // Sidebar - Explicitly building inner HTML to ensure content exists
                const sidebar = document.createElement('aside');
                sidebar.id = UI_SPEC.components.sidebar.id;
                sidebar.className = UI_SPEC.components.sidebar.classes;
                sidebar.innerHTML = `
                    <div class="p-5 border-b border-slate-200/60 bg-white/40 backdrop-blur-sm">
                        <div class="flex justify-between items-center mb-1">
                            <h3 class="font-bold text-lg text-slate-800">Объекты рядом</h3>
                            <span class="text-[10px] font-mono bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">LIVE</span>
                        </div>
                        <p class="text-xs text-slate-500 font-mono">НАЙДЕНО ${LOCATIONS_DATA.length} ОБЪЕКТА</p>
                    </div>
                    <div id="list-content" class="flex-1 overflow-y-auto p-3 space-y-2">
                        <!-- Items injected here -->
                    </div>
                    <div class="p-4 border-t border-slate-200/60 bg-white/40 text-center">
                        <button id="btn-close-sidebar-mobile" class="md:hidden text-sm font-medium text-slate-500 hover:text-slate-800">Закрыть список</button>
                    </div>
                `;
                root.appendChild(sidebar);

                // Card
                const cardWrapper = document.createElement('div');
                cardWrapper.id = 'card-wrapper';
                cardWrapper.innerHTML = `
                <div id="object-card" class="absolute bottom-6 left-6 right-6 md:left-auto md:right-6 md:w-[420px] glass-panel rounded-3xl shadow-2xl interactive flex flex-col overflow-hidden transform translate-y-[120%] transition-transform duration-500 cubic-bezier(0.34, 1.56, 0.64, 1) z-30">
                    <div class="relative h-56 bg-slate-200 overflow-hidden group">
                        <img id="card-img" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" src="" alt="">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/20 to-transparent"></div>
                        <div class="absolute bottom-4 left-5 right-5 text-white">
                            <span id="card-cat" class="inline-block px-2 py-1 rounded-md bg-blue-600/90 text-[10px] font-bold tracking-wider mb-2 backdrop-blur-md border border-white/10">CATEGORY</span>
                            <h2 id="card-title" class="text-2xl font-bold leading-tight shadow-sm">Title</h2>
                        </div>
                        <button id="card-close" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center text-white hover:bg-white/20 transition-colors border border-white/10">&times;</button>
                    </div>
                    <div class="p-6 flex flex-col gap-4 bg-white/50">
                        <div class="flex items-center gap-4 text-sm text-slate-500 font-mono border-b border-slate-200/60 pb-4">
                            <div class="flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                <span id="card-dist" class="font-medium text-slate-700">0м</span>
                            </div>
                            <div class="w-px h-4 bg-slate-300"></div>
                            <div class="flex items-center gap-1.5">
                                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                                <span class="text-xs font-medium text-emerald-700">ДОСТУПНО ДЛЯ AR</span>
                            </div>
                        </div>
                        <p id="card-desc" class="text-slate-600 leading-relaxed text-sm">Description...</p>
                        <div class="grid grid-cols-2 gap-3 mt-2">
                            <button class="py-3 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm hover:bg-white hover:border-slate-300 transition-all active:scale-95">Подробнее</button>
                            <button id="btn-ar-launch" class="py-3 rounded-xl bg-blue-600 text-white font-semibold text-sm shadow-lg shadow-blue-500/30 hover:bg-blue-700 hover:shadow-blue-500/50 active:scale-95 transition-all flex items-center justify-center gap-2 group">
                                <svg class="w-4 h-4 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                                ЗАПУСТИТЬ AR
                            </button>
                        </div>
                    </div>
                </div>
                `;
                root.appendChild(cardWrapper);

                root.appendChild(createElement(UI_SPEC.components.arOverlay));
                root.appendChild(createElement(UI_SPEC.components.toast));

                // Populate List Immediately
                this.populateList();
            }

            populateList() {
                const listContent = document.getElementById('list-content');
                if (!listContent) return console.error("List container not found");

                listContent.innerHTML = ''; // Clear existing

                LOCATIONS_DATA.forEach(loc => {
                    const item = document.createElement('div');
                    item.className = 'p-3.5 rounded-xl bg-white/40 hover:bg-white/80 transition-all cursor-pointer border border-white/20 hover:border-blue-200 hover:shadow-md group flex gap-3 items-start';
                    item.innerHTML = `
                        <div class="mt-1 w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start mb-0.5">
                                <span class="font-bold text-slate-800 text-sm truncate pr-2 group-hover:text-blue-700 transition-colors">${loc.title}</span>
                                <span class="text-[10px] font-mono text-slate-400 bg-slate-100/80 px-1.5 py-0.5 rounded shrink-0">${loc.distance}</span>
                            </div>
                            <div class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${loc.description}</div>
                        </div>
                    `;
                    item.onclick = () => {
                        this.openCard(loc);
                        if(window.innerWidth < 1024) this.toggleSidebar(false);
                    };
                    listContent.appendChild(item);
                });
            }

            async initMap() {
                ymaps.ready(() => {
                    this.map = new ymaps.Map("map-container", {
                        center: [55.751244, 37.618423], zoom: 15, controls: [], behaviors: ['default', 'scrollZoom']
                    });
                    LOCATIONS_DATA.forEach(loc => this.addPlacemark(loc));
                });
            }

            addPlacemark(locationData) {
                const getLayoutClass = ymaps.templateLayoutFactory.createClass(`
                    <div class="marker-container interactive" style="width: 48px; height: 48px; position: relative; cursor: pointer;">
                        <div class="marker-label dark-glass px-2 py-1 rounded-lg text-[10px] font-bold shadow-lg border border-white/10">${locationData.title}</div>
                        <div class="absolute inset-0 bg-blue-500 rounded-full opacity-20 animate-ping"></div>
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-white rounded-full shadow-[0_0_15px_rgba(59,130,246,0.6)] border-2 border-blue-500 flex items-center justify-center z-10 transition-transform hover:scale-110">
                            <div class="w-2 h-2 bg-blue-600 rounded-full"></div>
                        </div>
                    </div>
                `);
                const placemark = new ymaps.Placemark(locationData.coords, {}, {
                    iconLayout: getLayoutClass, iconShape: { type: 'Circle', coordinates: [0, 0], radius: 30 }
                });
                placemark.events.add('click', (e) => { e.preventDefault(); e.stopPropagation(); this.openCard(locationData); });
                this.map.geoObjects.add(placemark);
            }

            bindEvents() {
                document.addEventListener('click', (e) => {
                    if (e.target.closest('#card-close')) this.closeCard();
                    if (e.target.closest('#btn-ar-launch')) this.launchAR();
                    if (e.target.closest('#btn-ar-close')) this.closeAR();
                    if (e.target.closest('#btn-menu')) this.toggleSidebar();
                    if (e.target.closest('#btn-close-sidebar-mobile')) this.toggleSidebar(false);
                    if (e.target.closest('#btn-locate-me')) this.showToast("Определение геолокации...", "info");
                });
            }

            toggleSidebar(forceState = null) {
                const sidebar = document.getElementById('location-list');
                this.state.isSidebarOpen = forceState !== null ? forceState : !this.state.isSidebarOpen;

                if (this.state.isSidebarOpen) {
                    sidebar.classList.remove('-translate-x-[110%]');
                    sidebar.classList.add('translate-x-0');
                } else {
                    sidebar.classList.remove('translate-x-0');
                    sidebar.classList.add('-translate-x-[110%]');
                }
            }

            openCard(data) {
                this.state.selectedLocation = data;
                const card = document.getElementById('object-card');
                document.getElementById('card-img').src = `https://placehold.co/600x400/1e293b/white?text=${encodeURIComponent(data.category)}`;
                document.getElementById('card-title').textContent = data.title;
                document.getElementById('card-cat').textContent = data.category;
                document.getElementById('card-desc').textContent = data.description;
                document.getElementById('card-dist').textContent = data.distance;
                card.classList.remove('translate-y-[120%]');
                card.classList.add('translate-y-0');
                this.map.panTo(data.coords, { flying: true, duration: 600, offset: [0, -50] });
            }

            closeCard() {
                const card = document.getElementById('object-card');
                card.classList.remove('translate-y-0');
                card.classList.add('translate-y-[120%]');
                this.state.selectedLocation = null;
            }

            showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'dark-glass px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-enter min-w-[200px] border border-white/10';
                toast.innerHTML = `<div class="w-2 h-2 rounded-full ${type === 'error' ? 'bg-red-500' : 'bg-blue-500'} shadow-[0_0_8px_currentColor]"></div><span class="text-sm font-medium">${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(10px)'; setTimeout(() => toast.remove(), 300); }, 3000);
            }

            launchAR() {
                if (!this.state.selectedLocation) return;
                const overlay = document.getElementById('ar-overlay');
                overlay.classList.remove('hidden'); overlay.classList.add('flex');
                document.getElementById('ar-loader').style.display = 'flex';
                this.initThreeJS(this.state.selectedLocation.modelUrl);
            }

            closeAR() {
                const overlay = document.getElementById('ar-overlay');
                overlay.classList.add('hidden'); overlay.classList.remove('flex');
                if (this.threeScene) { this.threeScene.dispose(); this.threeScene = null; }
            }

            initThreeJS(modelUrl) {
                const canvas = document.getElementById('ar-canvas');
                const loaderEl = document.getElementById('ar-loader');
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1e293b);
                scene.fog = new THREE.FogExp2(0x1e293b, 0.05);
                const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(0, 1.5, 4);
                const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); scene.add(ambientLight);
                const spotLight = new THREE.SpotLight(0xffffff, 1.5); spotLight.position.set(5, 10, 5); spotLight.angle = Math.PI / 6; spotLight.penumbra = 0.5; spotLight.castShadow = true; scene.add(spotLight);
                const rimLight = new THREE.DirectionalLight(0x3b82f6, 1); rimLight.position.set(-5, 2, -5); scene.add(rimLight);
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 }));
                plane.rotation.x = -Math.PI / 2; plane.receiveShadow = true; scene.add(plane);
                const gridHelper = new THREE.GridHelper(50, 50, 0x3b82f6, 0x334155); gridHelper.position.y = 0.01; gridHelper.material.opacity = 0.2; gridHelper.material.transparent = true; scene.add(gridHelper);
                const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.05; controls.maxPolarAngle = Math.PI / 2 - 0.05;
                const loader = new THREE.GLTFLoader();
                loader.load(modelUrl, (gltf) => {
                    const model = gltf.scene;
                    const box = new THREE.Box3().setFromObject(model); const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z); const scale = 2 / maxDim;
                    model.scale.set(scale, scale, scale); model.position.sub(center.multiplyScalar(scale)); model.position.y += (size.y * scale) / 2;
                    model.traverse((node) => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; } });
                    scene.add(model); loaderEl.style.display = 'none';
                    const animate = () => { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }; animate();
                }, undefined, (error) => { console.error(error); loaderEl.innerHTML = '<div class="text-red-500 font-bold">Ошибка загрузки</div>'; });
                const onResize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
                window.addEventListener('resize', onResize);
                this.threeScene = { dispose: () => { window.removeEventListener('resize', onResize); renderer.dispose(); scene.clear(); } };
            }
        }

        window.addEventListener('DOMContentLoaded', () => new App());
    </script>
</body>
</html>
